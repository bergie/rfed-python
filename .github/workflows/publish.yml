# rfed — release publisher.
#
# Publishes to PyPI when a `v*` tag is pushed, and can be triggered manually
# from the Actions tab (toggle "dry_run" to validate packaging without
# uploading anything).
#
#   PyPI  build sdist+wheel (make release-dry) + upload via OIDC
#           trusted publishing (pypa/gh-action-pypi-publish). No API token.
#
# Before tagging, bump the version in pyproject.toml.
#
# One-time registry setup: trusted publishing. Configure once at
# https://pypi.org:
#   Add a publisher -> GitHub -> owner: <this repo owner>,
#   repository: rfed-python, workflow: release.yml, environment: (leave blank).
#
# Releases assume the tagged commit already passed test.yml.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate packaging without uploading"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pypi:
    # Trusted publishing (OIDC). See the one-time setup note above.
    name: PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel and validate metadata
        run: make release-dry

      - name: Publish to PyPI (OIDC trusted publishing)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
