# rfed — test runner.
#
# A single job runs exactly what a contributor runs locally:
# `make install` then `make test`.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: make install && make test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installed runtimes
        run: python3 --version

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test
